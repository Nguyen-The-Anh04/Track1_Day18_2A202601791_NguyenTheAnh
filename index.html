<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLearn - Trang chủ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
        }

        h1 {
            color: white;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .option-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .option-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .option-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .option-card p {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .option-a { border-top: 5px solid #667eea; }
        .option-b { border-top: 5px solid #f5576c; }
        .option-c { border-top: 5px solid #4facfe; }

        .footer {
            color: rgba(255,255,255,0.7);
            margin-top: 30px;
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 VLearn</h1>
        <p class="subtitle">Chọn option để xem giao diện tương tác</p>
        
        <div class="options-grid">
            <a href="option-a.html" class="option-card option-a">
                <div class="option-icon">📝</div>
                <h2>Option A</h2>
                <p>Tạo ghi chú & Ghi chú đã lưu</p>
                <span class="badge">2 màn hình</span>
            </a>
            
            <a href="option-b.html" class="option-card option-b">
                <div class="option-icon">📋</div>
                <h2>Option B</h2>
                <p>Bản nháp ghi chú & Giải thích nội dung</p>
                <span class="badge">2 màn hình</span>
            </a>
            
            <a href="option-c.html" class="option-card option-c">
                <div class="option-icon">🤖</div>
                <h2>Option C</h2>
                <p>Bản ghi chú AI & Đề xuất ghi chú AI</p>
                <span class="badge">2 màn hình</span>
            </a>
        </div>
        
        <div class="footer">
            <p>© 2024 VLearn - Ứng dụng ghi chú thông minh</p>
        </div>
    </div>
</body>
</html>
